<!DOCTYPE html>
<html lang="it" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>News & Eventi - Track Splits</title>
    <script>window.APP_BASE_PATH = '..';</script>
    <meta name="theme-color" content="#3b82f6">
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjM2I4MmY2IiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PHBhdGggZD0iTTEyIDJ2MjAiPjwvcGF0aD48cGF0aCBkPSJNMTcgNUg5LjVhMy41IDMuNSAwIDAgMCAwIDdoNWEzLjUgMy41IDAgMCAxIDAgN0g2Ij48L3BhdGg+PC9zdmc+">
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6', // Brand color
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        dark: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            border: '#334155'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../css/style.css">
    
    <!-- Stili aggiuntivi per il contenuto HTML delle news -->
    <style>
        .news-content a {
            color: #3b82f6;
            text-decoration: underline;
        }
        .dark .news-content a {
            color: #60a5fa;
        }
        .news-content b, .news-content strong {
            font-weight: 700;
        }
        .news-content ul {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .news-content ol {
            list-style-type: decimal;
            padding-left: 1.5rem;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .news-content h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-dark-bg dark:text-gray-100 min-h-screen flex flex-col selection:bg-primary-200 selection:text-primary-900 dark:selection:bg-primary-900 dark:selection:text-primary-100">

    

    <!-- Main Content (Feed) -->
    <main class="flex-grow max-w-3xl w-full mx-auto px-4 py-6 flex flex-col gap-5 relative pb-10">
        
        <div class="mb-4 text-center">
            <h2 class="text-3xl font-display font-bold text-gray-800 dark:text-gray-100">Bacheca</h2>
            <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">Gli ultimi aggiornamenti ed eventi</p>
        </div>

        <!-- Search Bar -->
        <div class="relative mb-6">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                </svg>
            </div>
            <input type="text" id="searchInput" class="block w-full pl-10 pr-3 py-3 border border-gray-200 dark:border-dark-border rounded-xl leading-5 bg-white dark:bg-dark-card text-gray-900 dark:text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 sm:text-sm transition-shadow shadow-sm" placeholder="Cerca tra le news (es. Maratona)...">
        </div>

        <div id="newsFeed" class="flex flex-col gap-4">
            <!-- News Cards Injected Here -->
        </div>

    </main>

    <!-- Full Article Modal Overlay -->
    <div id="articleModal" class="fixed inset-0 bg-white dark:bg-dark-bg z-[100] hidden flex-col transform translate-y-full transition-transform duration-300 overflow-y-auto">
        <!-- Modal Header -->
        <div class="sticky top-0 bg-white/90 dark:bg-dark-bg/90 backdrop-blur-md border-b border-gray-100 dark:border-dark-border z-10">
            <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
                <button id="closeArticleBtn" class="flex items-center gap-2 text-primary-600 dark:text-primary-400 font-medium hover:bg-gray-100 dark:hover:bg-gray-800 px-3 py-2 rounded-xl transition-colors -ml-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                    Indietro
                </button>
            </div>
        </div>
        
        <!-- Modal Content -->
        <div class="flex-grow w-full max-w-3xl mx-auto px-4 py-6">
            <div class="mb-4">
                <span id="articleTag" class="text-xs font-bold uppercase tracking-wider text-primary-600 dark:text-primary-400 bg-primary-50 dark:bg-primary-900/30 px-3 py-1 rounded-full mb-3 inline-block">Categoria</span>
                <h1 id="articleTitle" class="text-3xl font-display font-bold text-gray-900 dark:text-white leading-tight mb-2">Titolo</h1>
                <p id="articleDate" class="text-sm text-gray-500 dark:text-gray-400">Data</p>
            </div>
            
            <div id="articleBody" class="news-content text-gray-700 dark:text-gray-300 leading-relaxed space-y-4 pb-20">
                <!-- Content Injected Here -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../data/news_data.js"></script>
    <script src="../js/news.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
