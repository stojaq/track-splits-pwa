<!DOCTYPE html>
<html lang="it" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reaction Time - Track Splits</title>
    <script>window.APP_BASE_PATH = '..';</script>
    <meta name="theme-color" content="#3b82f6">
    <link rel="manifest" href="../manifest.json">
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        primary: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a' },
                        dark: { bg: '#0f172a', card: '#1e293b', border: '#334155' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .game-bg-blue { background-color: #3b82f6; color: white; }
        .game-bg-orange { background-color: #f97316; color: white; }
        .game-bg-red { background-color: #ef4444; color: white; }
        .game-bg-green { background-color: #22c55e; color: white; }
        .game-bg-darkred { background-color: #991b1b; color: white; }
        
        .shake-animation {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        
        /* Previene selezione testo durante i tap rapidi */
        .no-select {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-dark-bg dark:text-gray-100 min-h-screen flex flex-col no-select">

    <!-- Header / Back Navigation -->
    <header class="absolute top-0 w-full z-50 p-4 flex justify-between items-center pointer-events-none">
        <div class="flex gap-3 items-center pointer-events-auto">
            <a href="arcade.html" class="bg-white/20 hover:bg-white/30 backdrop-blur-md text-white p-2 rounded-full transition-colors flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                </svg>
            </a>
            <button id="soundToggleBtn" class="bg-white/20 hover:bg-white/30 backdrop-blur-md text-white p-2 rounded-full transition-colors flex items-center justify-center">
                <svg id="icon-sound-on" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                </svg>
                <svg id="icon-sound-off" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 hidden opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                    <line x1="17" y1="7" x2="21" y2="17" stroke-width="2" stroke-linecap="round"/>
                    <line x1="21" y1="7" x2="17" y2="17" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
        <div class="pointer-events-auto bg-white/20 backdrop-blur-md text-white px-3 py-1 rounded-full text-sm font-bold shadow-sm">
            PB: <span id="pb-display">---</span>
        </div>
    </header>

    <!-- Interactive Game Area -->
    <main id="gameArea" class="flex-grow flex flex-col items-center justify-center w-full h-full cursor-pointer transition-colors duration-200 game-bg-blue">
        
        <div class="text-center px-4">
            <svg id="gameIcon" xmlns="http://www.w3.org/2000/svg" class="h-24 w-24 mx-auto mb-6 opacity-90 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <!-- Mano che tocca l'icona per default -->
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122" />
            </svg>
            
            <h1 id="mainText" class="text-4xl md:text-6xl font-display font-bold tracking-tight mb-2 shadow-sm">
                Tocca per iniziare
            </h1>
            <p id="subText" class="text-lg md:text-xl opacity-80 max-w-md mx-auto mt-4 font-medium">
                Mettiti sui blocchi di partenza.
            </p>
            
            <!-- Result Display (Hidden initially) -->
            <div id="resultBox" class="hidden mt-8 flex flex-col items-center animate-fade-in">
                <div class="text-6xl md:text-8xl font-black font-mono tracking-tighter" id="reactionTimeDisplay">
                    0.000<span class="text-2xl md:text-4xl">s</span>
                </div>
                <p id="resultMessage" class="mt-4 text-xl font-bold bg-white/20 px-4 py-2 rounded-full inline-block backdrop-blur-sm">
                    Ottimo Riflesso!
                </p>
                <p class="mt-8 text-sm opacity-70 uppercase tracking-widest font-bold">Tocca per riprovare</p>
            </div>
        </div>

    </main>

    <!-- Scripts -->
    <script src="../js/reaction.js"></script>
</body>
</html>
