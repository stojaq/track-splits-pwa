<!DOCTYPE html>
<html lang="it" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lancio Perfetto - Track Arcade</title>
    <script>window.APP_BASE_PATH = '..';</script>
    <meta name="theme-color" content="#9333ea">
    <link rel="manifest" href="../manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        primary: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a' },
                        dark: { bg: '#0f172a', card: '#1e293b', border: '#334155' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .no-select { user-select: none; -webkit-touch-callout: none; }
        
        .power-gradient {
            background: linear-gradient(90deg, rgba(239,68,68,1) 0%, rgba(250,204,21,1) 60%, rgba(34,197,94,1) 90%, rgba(59,130,246,1) 100%);
        }
        
        .angle-gradient {
            background: conic-gradient(from 270deg, #ef4444 0deg, #eab308 25deg, #22c55e 35deg, #22c55e 41deg, #eab308 50deg, #ef4444 90deg, transparent 90deg);
        }

        .bg-sky-gradient {
            background: linear-gradient(to bottom, #1e3a8a 0%, #3b82f6 100%);
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col no-select overflow-hidden">

    <header class="absolute top-0 w-full z-50 p-4 flex justify-between items-center pointer-events-none">
        <a href="arcade.html" class="pointer-events-auto bg-white/20 hover:bg-white/30 backdrop-blur-md text-white p-2 rounded-full transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
        </a>
        <div class="flex items-center gap-2">
            <button id="soundToggleBtn" class="pointer-events-auto bg-white/20 hover:bg-white/30 backdrop-blur-md text-white p-2 rounded-full transition-colors flex items-center justify-center">
                <svg id="icon-sound-on" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /></svg>
                <svg id="icon-sound-off" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /><line x1="17" y1="7" x2="21" y2="17" stroke-width="2" stroke-linecap="round"/><line x1="21" y1="7" x2="17" y2="17" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <div class="pointer-events-auto bg-white/20 backdrop-blur-md text-white px-3 py-1 rounded-full text-sm font-bold shadow-sm">
                Record: <span id="pb-display">---</span> m
            </div>
        </div>
    </header>

    <main id="gameArea" class="flex-grow relative w-full h-full cursor-pointer overflow-hidden bg-sky-gradient flex flex-col justify-between">
        
        <!-- Overlays -->
        <div id="uiOverlay" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center z-50 backdrop-blur-sm transition-opacity duration-300">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-24 w-24 mx-auto mb-6 text-purple-400 drop-shadow-[0_0_15px_rgba(168,85,247,0.5)]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
            </svg>
            <h1 class="text-4xl md:text-6xl font-display font-bold tracking-tight mb-2 text-center text-white">Lancio Perfetto</h1>
            <div class="text-base text-gray-300 max-w-lg mx-auto mt-4 text-center px-6 leading-relaxed space-y-4">
                <p><span class="font-bold text-purple-400">Fase 1:</span> Ferma la barra della <strong>FORZA</strong> il più a destra possibile.</p>
                <p><span class="font-bold text-purple-400">Fase 2:</span> Ferma il mirino esattamente nella zona verde (<strong>38 gradi</strong>) per l'aerodinamica ottimale.</p>
            </div>
            <button id="startBtn" class="mt-8 bg-purple-600 hover:bg-purple-500 text-white font-bold py-4 px-12 rounded-full text-xl shadow-lg transition-transform hover:scale-105 active:scale-95 pointer-events-auto">LANCIAMO</button>
        </div>

        <div id="resultOverlay" class="absolute inset-0 bg-black/60 flex flex-col items-center justify-center z-50 hidden backdrop-blur-sm">
            <div class="bg-gray-900/90 border border-gray-700 p-8 rounded-3xl shadow-2xl text-center max-w-sm w-full mx-4 transform scale-95 transition-transform duration-300">
                <h2 class="text-3xl font-black uppercase tracking-wider mb-2 text-purple-400">Misura</h2>
                <div class="text-6xl font-mono font-bold my-4 text-white" id="resultScore">0<span class="text-2xl">m</span></div>
                
                <div class="flex justify-between text-sm text-gray-400 mb-6 bg-gray-800 p-3 rounded-lg border border-gray-700">
                    <div>Forza: <span id="resPower" class="text-white font-bold text-lg">--%</span></div>
                    <div>Angolo: <span id="resAngle" class="text-white font-bold text-lg">--°</span></div>
                </div>

                <p id="resultDesc" class="text-gray-400 mb-8 font-medium">--</p>
                <button id="retryBtn" class="w-full bg-white text-gray-900 font-bold py-3 rounded-xl hover:bg-gray-200 pointer-events-auto text-lg shadow-lg">RIPROVA</button>
            </div>
        </div>

        <!-- Upper HUD (Meters) -->
        <div id="hudElements" class="w-full max-w-md mx-auto pt-24 px-6 pointer-events-none z-40 relative">
            <div class="mb-8" id="powerContainer">
                <h3 class="text-sm font-black tracking-widest mb-2 text-white/80 flex justify-between drop-shadow-md">
                    <span>FORZA</span>
                    <span id="powerValDisplay" class="text-gray-300 font-mono">0%</span>
                </h3>
                <div class="h-6 w-full bg-gray-900/50 rounded-full border-2 border-white/20 overflow-hidden relative shadow-inner backdrop-blur-sm">
                    <div class="absolute inset-0 power-gradient opacity-90"></div>
                    <div id="powerCursor" class="absolute top-0 bottom-0 w-2 bg-white shadow-[0_0_15px_white] z-10"></div>
                </div>
            </div>

            <div class="relative w-full h-24 mx-auto flex justify-center opacity-50 transition-opacity" id="angleContainer">
                <div class="absolute bottom-0 w-48 h-24 rounded-t-full border-[12px] border-gray-900/50 angle-gradient opacity-90 backdrop-blur-sm shadow-xl"></div>
                <div class="absolute bottom-2 text-white/50 text-[10px] font-bold tracking-widest uppercase">ZONA VERDE = 38°</div>
            </div>
        </div>

        <!-- The World Camera Container -->
        <div id="worldContainer" class="absolute inset-0 w-[5000px] h-full pointer-events-none z-10 transition-transform">
            
            <!-- Ground / Field -->
            <div class="absolute bottom-0 w-full h-32 bg-green-600 border-t-[8px] border-green-400 shadow-[inset_0_10px_20px_rgba(0,0,0,0.2)]">
                <!-- Dynamically populated distance markers via JS -->
                <div id="distanceMarkers" class="absolute inset-0 w-full h-full"></div>
            </div>

            <!-- Runway (for Athlete) -->
            <div class="absolute bottom-0 left-0 w-[400px] h-32 bg-[#c95c47] border-t-[8px] border-white shadow-2xl z-20" style="background-image: repeating-linear-gradient(90deg, transparent, transparent 48px, rgba(255, 255, 255, 0.3) 48px, rgba(255, 255, 255, 0.3) 50px);"></div>
            
            <!-- Foul Line (Arc) -->
            <div class="absolute bottom-4 left-[350px] w-20 h-24 border-r-8 border-white rounded-tr-full z-20"></div>

            <!-- Athlete (Fixed in World) -->
            <div id="athlete" class="absolute bottom-24 left-[280px] w-32 h-32 z-30 flex items-end justify-center transition-transform">
                <svg viewBox="0 0 100 150" class="w-24 drop-shadow-2xl">
                    <circle cx="50" cy="20" r="15" fill="#1e293b" stroke="white" stroke-width="3"/>
                    <line x1="50" y1="35" x2="40" y2="90" stroke="white" stroke-width="6" stroke-linecap="round"/>
                    <line x1="40" y1="90" x2="20" y2="140" stroke="white" stroke-width="6" stroke-linecap="round"/>
                    <line x1="40" y1="90" x2="70" y2="140" stroke="white" stroke-width="6" stroke-linecap="round"/>
                    <line id="armBack" x1="50" y1="45" x2="20" y2="30" stroke="white" stroke-width="5" stroke-linecap="round"/>
                    <line x1="50" y1="45" x2="80" y2="60" stroke="white" stroke-width="5" stroke-linecap="round"/>
                </svg>
            </div>
            
            <!-- The Javelin (Flies across world) -->
            <div id="javelin" class="absolute w-[180px] h-[4px] bg-yellow-400 border border-yellow-200 rounded-full z-40 origin-[50%_50%] shadow-[0_0_10px_rgba(250,204,21,0.5)] flex items-center justify-end">
                <div class="w-0 h-0 border-y-[3px] border-y-transparent border-l-[15px] border-l-gray-300 absolute -right-2"></div>
            </div>
            
        </div>

        <div id="statusText" class="absolute bottom-[40vh] w-full text-center text-3xl font-black text-white pointer-events-none uppercase tracking-widest drop-shadow-lg z-50"></div>
    </main>

    <script src="../js/throw.js"></script>
</body>
</html>
