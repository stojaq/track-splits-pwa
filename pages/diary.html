<!DOCTYPE html>
<html lang="it" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diario Allenamenti - Track Splits</title>
    <script>window.APP_BASE_PATH = '..';</script>
    <meta name="theme-color" content="#3b82f6">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        dark: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            border: '#334155'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../css/style.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-dark-bg dark:text-gray-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white dark:bg-dark-card border-b border-gray-200 dark:border-dark-border sticky top-0 z-10">
        <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
            <h1 class="text-xl font-display font-bold text-gray-900 dark:text-white">Diario Allenamenti</h1>
            <button id="addWorkoutBtnTop" class="bg-primary-600 text-white p-2 rounded-full shadow hover:bg-primary-700 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
            </button>
        </div>
    </header>

    <main class="flex-grow max-w-3xl w-full mx-auto px-4 py-6 flex flex-col gap-6">
        
        <!-- Local Storage Warning -->
        <div class="bg-red-50 dark:bg-red-900/20 border-l-4 border-red-500 text-red-700 dark:text-red-400 p-4 rounded-lg text-sm flex items-start gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <div>
                <p class="font-bold">Attenzione: Dati salvati solo su questo dispositivo</p>
                <p class="mt-1">Questo diario usa la memoria del tuo telefono. Se disinstalli l'app o pulisci la cache del browser, perderai tutti i tuoi allenamenti salvati.</p>
            </div>
        </div>

        <!-- Dashboard Statistiche -->
        <section id="diaryStats" class="grid grid-cols-1 sm:grid-cols-2 gap-4 hidden">
            <!-- Card Km -->
            <div class="bg-white dark:bg-dark-card p-5 rounded-2xl shadow-sm border border-gray-100 dark:border-dark-border flex flex-col justify-center items-center">
                <h3 class="text-gray-500 dark:text-gray-400 text-sm font-semibold uppercase mb-2" id="statsMonthLabel">Questo Mese</h3>
                <div class="flex items-baseline gap-1">
                    <span id="statsTotalKm" class="text-4xl font-display font-bold text-gray-900 dark:text-white">0.0</span>
                    <span class="text-gray-500 font-medium">km</span>
                </div>
            </div>
            <!-- Card Chart -->
            <div class="bg-white dark:bg-dark-card p-5 rounded-2xl shadow-sm border border-gray-100 dark:border-dark-border flex items-center justify-center min-h-[160px]">
                <div class="w-full max-w-[200px]">
                    <canvas id="workoutsChart"></canvas>
                </div>
            </div>
        </section>

        <!-- Feed Allenamenti -->
        <div id="diaryFeed" class="flex flex-col gap-4">
            <!-- Allenamenti inseriti via JS -->
            <div id="emptyDiary" class="text-center py-12 text-gray-500 dark:text-gray-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto mb-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                </svg>
                <p>Nessun allenamento presente.</p>
                <button id="addWorkoutBtnEmpty" class="mt-4 text-primary-600 dark:text-primary-400 font-medium hover:underline">Aggiungi il tuo primo allenamento</button>
            </div>
        </div>

    </main>

    <!-- Modal Aggiungi Allenamento -->
    <div id="workoutModal" class="fixed inset-0 bg-black/50 z-50 hidden opacity-0 transition-opacity flex items-end sm:items-center justify-center">
        <div class="bg-white dark:bg-dark-card w-full max-w-lg sm:rounded-2xl rounded-t-2xl p-6 transform translate-y-full transition-transform duration-300" id="workoutModalContent">
            <div class="flex justify-between items-center mb-5">
                <h2 class="text-xl font-bold text-gray-900 dark:text-white">Nuovo Allenamento</h2>
                <button id="closeModalBtn" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            
            <form id="workoutForm" class="flex flex-col gap-4">
                <!-- Data -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Data</label>
                    <input type="date" id="workoutDate" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary-500 outline-none">
                </div>

                <!-- Titolo -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Titolo</label>
                    <input type="text" id="workoutTitle" placeholder="es. 10x400m in pista" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary-500 outline-none">
                </div>

                <!-- Tipo & Distanza -->
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Tipo</label>
                        <select id="workoutType" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary-500 outline-none">
                            <option value="Lento">Lento</option>
                            <option value="Medio">Medio</option>
                            <option value="Ripetute">Ripetute</option>
                        </select>
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Distanza (km)</label>
                        <input type="number" step="0.1" id="workoutDistance" placeholder="es. 10" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary-500 outline-none">
                    </div>
                </div>

                <!-- Blocchi Ripetute (Nascosto di default) -->
                <div id="repsStructureContainer" class="hidden flex-col gap-3">
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300">Blocchi Ripetute</label>
                    <div id="blocksList" class="flex flex-col gap-3">
                        <!-- Template Blocco -->
                        <div class="block-row flex items-center gap-2 bg-gray-50 dark:bg-gray-800/50 p-3 rounded-lg border border-gray-100 dark:border-gray-700 relative">
                            <div class="flex-1">
                                <label class="block text-[10px] text-gray-500 uppercase font-bold mb-1">Ripetizioni</label>
                                <input type="number" min="1" placeholder="es. 10" class="block-reps w-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 rounded px-2 py-1.5 text-sm focus:ring-1 focus:ring-primary-500 outline-none">
                            </div>
                            <div class="flex-1">
                                <label class="block text-[10px] text-gray-500 uppercase font-bold mb-1">Distanza (m)</label>
                                <input type="number" min="10" step="10" placeholder="es. 400" class="block-dist w-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 rounded px-2 py-1.5 text-sm focus:ring-1 focus:ring-primary-500 outline-none">
                            </div>
                            <div class="flex-1">
                                <label class="block text-[10px] text-gray-500 uppercase font-bold mb-1">Recupero</label>
                                <input type="text" placeholder="es. 1'30" class="block-rec w-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 rounded px-2 py-1.5 text-sm focus:ring-1 focus:ring-primary-500 outline-none">
                            </div>
                            <button type="button" class="remove-block-btn mt-5 text-gray-400 hover:text-red-500 opacity-50 cursor-not-allowed" disabled>
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                            </button>
                        </div>
                    </div>
                    <button type="button" id="addBlockBtn" class="text-sm font-medium text-primary-600 dark:text-primary-400 flex items-center justify-center gap-1 bg-primary-50 dark:bg-primary-900/20 py-2 rounded-lg hover:bg-primary-100 dark:hover:bg-primary-900/40 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                        Aggiungi Blocco
                    </button>
                </div>

                <!-- Note -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Note (Opzionale)</label>
                    <textarea id="workoutNotes" rows="3" placeholder="Sensazioni, fatica, compagni d'allenamento..." class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary-500 outline-none"></textarea>
                </div>

                <button type="submit" class="w-full mt-2 bg-primary-600 hover:bg-primary-700 text-white font-semibold py-3 px-4 rounded-xl transition-colors shadow-sm">
                    Salva Allenamento
                </button>
            </form>
        </div>
    </div>

    <!-- Scripts -->

    <script src="../js/diary.js"></script>
</body>
</html>
