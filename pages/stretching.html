<!DOCTYPE html>
<html lang="it" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stretching & Mobilità - Track Splits</title>
    <script>window.APP_BASE_PATH = '..';</script>
    <meta name="theme-color" content="#3b82f6">
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjM2I4MmY2IiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PHBhdGggZD0iTTEyIDJ2MjAiPjwvcGF0aD48cGF0aCBkPSJNMTcgNUg5LjVhMy41IDMuNSAwIDAgMCAwIDdoNWEzLjUgMy41IDAgMCAxIDAgN0g2Ij48L3BhdGg+PC9zdmc+">
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6', // Brand color
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        dark: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            border: '#334155'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-dark-bg dark:text-gray-100 min-h-screen flex flex-col selection:bg-primary-200 selection:text-primary-900 dark:selection:bg-primary-900 dark:selection:text-primary-100">

    

    <!-- Main Content -->
    <main class="flex-grow max-w-3xl w-full mx-auto px-4 py-6 flex flex-col gap-6 relative pb-10">
        
        <div class="mb-2 text-center">
            <h2 class="text-2xl font-display font-bold text-gray-800 dark:text-gray-100">Stretching & Mobilità</h2>
            <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">Prevenzione infortuni e defaticamento</p>
        </div>

        <!-- Tab Selector -->
        <div class="flex bg-gray-200/60 dark:bg-gray-800 p-1.5 rounded-xl shadow-inner">
            <button id="tabDynamicBtn" class="flex-1 py-2.5 text-sm font-semibold rounded-lg bg-white dark:bg-dark-card text-gray-900 dark:text-white shadow-sm transition-all transform scale-100">🏃 Dinamico (Pre-Corsa)</button>
            <button id="tabStaticBtn" class="flex-1 py-2.5 text-sm font-semibold rounded-lg text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 transition-all">🧘 Statico (Post-Corsa)</button>
        </div>

        <div class="pt-2">
            <button id="startRoutineBtn" class="w-full bg-primary-600 hover:bg-primary-700 text-white font-semibold py-3.5 px-4 rounded-xl shadow-sm hover:shadow transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v18l15-9L5 3z"/></svg>
                Avvia Routine Guidata
            </button>
        </div>

        <!-- Routine Modal Overlay -->
        <div id="routineModal" class="fixed inset-0 bg-gray-900/90 backdrop-blur-md z-[80] hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4">
            <div class="bg-white dark:bg-dark-card rounded-3xl w-full max-w-md p-6 flex flex-col items-center justify-center shadow-2xl transform scale-95 transition-transform duration-300" id="routineModalContent">
                
                <div class="w-full flex justify-end mb-4">
                    <button id="closeRoutineBtn" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                </div>

                <!-- Timer UI -->
                <div id="routineTimerUi" class="w-full flex flex-col items-center text-center">
                    <h3 id="routineExName" class="text-2xl font-bold font-display text-gray-800 dark:text-gray-100 mb-2">Preparati...</h3>
                    <p id="routineExTarget" class="text-sm font-medium text-primary-600 dark:text-primary-400 mb-8 bg-primary-50 dark:bg-primary-900/30 px-3 py-1 rounded-full">-</p>
                    
                    <div class="relative w-48 h-48 flex items-center justify-center mb-8">
                        <!-- SVG Circle for Timer -->
                        <svg class="absolute inset-0 w-full h-full transform -rotate-90">
                            <circle cx="96" cy="96" r="88" fill="none" stroke="currentColor" stroke-width="8" class="text-gray-100 dark:text-gray-800" />
                            <circle id="timerCircle" cx="96" cy="96" r="88" fill="none" stroke="currentColor" stroke-width="8" stroke-dasharray="552.92" stroke-dashoffset="0" class="text-primary-500 transition-all duration-1000 ease-linear" stroke-linecap="round"/>
                        </svg>
                        <span id="timerText" class="font-display font-bold text-6xl text-gray-800 dark:text-gray-100 z-10">--</span>
                    </div>

                    <div class="flex gap-4 mb-4">
                        <button id="pauseRoutineBtn" class="bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-800 dark:text-white px-6 py-3 rounded-xl font-medium transition-colors">
                            Pausa
                        </button>
                        <button id="skipRoutineBtn" class="bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-800 dark:text-white px-6 py-3 rounded-xl font-medium transition-colors flex items-center gap-1">
                            Salta <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
                        </button>
                    </div>
                    
                    <p id="routineProgress" class="text-sm text-gray-500 dark:text-gray-400 mt-4">Esercizio 1 di 5</p>
                </div>
            </div>
        </div>

        <!-- Exercise Grid -->
        <div id="exerciseGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Cards generated by JS -->
        </div>

    </main>

    <script src="../js/stretching.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
